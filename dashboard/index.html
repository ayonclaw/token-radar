<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Radar — pre-token protocols ranked by implied value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-radar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12 19 5"/><circle cx="12" cy="12" r="1.4" class="fill"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-chain" viewBox="0 0 24 24"><path d="M9 15l6-6"/><path d="M11 6.5 13 4.5a4 4 0 016 6l-2 2"/><path d="M13 17.5 11 19.5a4 4 0 01-6-6l2-2"/></symbol>
  <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" class="fill"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5 9.5 17 19 7"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 20v-6M13 20V8M18 20v-9"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
</svg>

<header class="top">
  <div class="brand">
    <svg class="glyph"><use href="#i-radar"/></svg>
    <span class="word">TOKEN<span class="slash">/</span>RADAR</span>
    <span class="tag">pre-token desk</span>
  </div>
  <nav class="tabs" id="tabs">
    <button data-view="board" class="on"><svg><use href="#i-grid"/></svg>board</button>
    <button data-view="charts"><svg><use href="#i-chart"/></svg>charts</button>
    <button data-view="excluded"><svg><use href="#i-x"/></svg>token listed</button>
  </nav>
  <div class="meta" id="meta"></div>
</header>

<section class="kpis" id="kpis"></section>

<section class="controls" id="controls">
  <label class="field search"><svg><use href="#i-search"/></svg>
    <input id="q" type="search" placeholder="protocol, category, chain" autocomplete="off" spellcheck="false">
  </label>
  <label class="field"><span>chain</span><select id="chain"></select></label>
  <label class="field"><span>category</span><select id="cat"></select></label>
  <label class="field"><span>sort</span><select id="sort">
    <option value="rank">implied value</option>
    <option value="tvl">tvl</option>
    <option value="months">months, no token</option>
    <option value="mult">multiple</option>
    <option value="chg7">7-day change</option>
    <option value="name">name</option>
  </select></label>
  <label class="check"><input id="watchOnly" type="checkbox"><span>watchlist only</span></label>
  <button class="ghost" id="reset"><svg><use href="#i-x"/></svg>reset</button>
  <div class="count" id="count"></div>
</section>

<main id="main">
  <div class="board-wrap">
    <table class="board" id="board">
      <thead><tr>
        <th class="c-rank sortable" data-sort="rank">#</th>
        <th class="c-name">protocol</th>
        <th class="c-chain">chain</th>
        <th class="c-num sortable" data-sort="tvl">tvl</th>
        <th class="c-num sortable" data-sort="chg7">7d</th>
        <th class="c-num sortable" data-sort="months">no token</th>
        <th class="c-num">×mult</th>
        <th class="c-score">score</th>
        <th class="c-num">implied $</th>
        <th class="c-why">why this one</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden></div>
  </div>
  <aside class="rail" id="rail"></aside>
</main>

<section class="charts" id="charts" hidden></section>
<section class="detail" id="detail" hidden></section>

<footer class="foot">
  <span class="formula" id="formula"></span>
  <span class="src" id="src"></span>
</footer>

<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
